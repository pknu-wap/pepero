name: pepero
services:
  web:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env.local
    volumes:
      - pepero-data:/app/.data
    networks:
      - waps-network
    ports:
      - "127.0.0.1:3002:3000"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/poems').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
networks:
  waps-network:
    external: true
volumes:
  pepero-data:
